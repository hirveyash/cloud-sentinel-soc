<!doctype html><html><head><meta charset="utf-8"><title>Category standard</title><style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#0f172a;color:#e2e8f0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex}
.rail{width:220px;background:#0b1222;border-right:1px solid #1e293b;padding:20px 16px}
.rail b{display:block;margin-bottom:24px}.rail a{display:block;padding:8px 10px;color:#94a3b8;border-radius:6px}.rail a.on{background:#1e293b;color:#fff}
main{flex:1;padding:24px 28px}
.banner{background:#14532d;color:#bbf7d0;border-radius:8px;padding:14px 18px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
.k{background:#1e293b;border-radius:10px;padding:18px}.k span{color:#94a3b8}.k b{display:block;font-size:36px}
.t{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.p{background:#1e293b;border-radius:10px;height:560px;padding:16px}.p h3{font-size:15px;margin-bottom:12px}
.p .e{color:#94a3b8;text-align:center;margin-top:200px}
</style></head><body>
<nav class="rail"><b>Cloud Sentinel</b><a class="on">Dashboard</a><a>Incidents</a><a>Events</a><a>Audit log</a></nav>
<main><div class="banner">✓ All Systems Operational</div>
<div class="kpis"><div class="k"><span>AWS events</span><b>0</b></div><div class="k"><span>GCP events</span><b>0</b></div><div class="k"><span>Azure events</span><b>0</b></div></div>
<div class="t"><div class="p"><h3>Live Incidents</h3><p class="e">No incidents</p></div><div class="p"><h3>Security Events</h3><p class="e">No events</p></div></div></main>
</body></html>
