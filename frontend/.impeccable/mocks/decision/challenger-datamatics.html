<!doctype html><html><head><meta charset="utf-8"><title>Datamatics Field</title><style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#000;color:#fff;font:13px/1.4 Consolas,ui-monospace,monospace}
.top{height:48px;display:flex;align-items:center;gap:28px;padding:0 28px;border-bottom:1px solid #fff}
.top span{opacity:.6}
.field{height:140px;margin:0 28px;background:repeating-linear-gradient(90deg,#fff 0 1px,#000 1px 4px,#fff 4px 5px,#000 5px 11px,#fff 11px 13px,#000 13px 17px)}
.banner{margin:18px 28px;padding:14px 18px;background:#fff;color:#000;font-size:22px;letter-spacing:.08em}
.cols{display:grid;grid-template-columns:repeat(3,1fr);margin:0 28px;border-top:1px solid #fff;border-bottom:1px solid #fff}
.c{padding:14px 18px;border-right:1px solid #fff}.c:last-child{border:0}.c b{display:block;font-size:56px;font-weight:400}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:20px 28px}
.l{border-top:1px solid #fff;height:420px}.l h4{font-weight:400;padding:10px 0;letter-spacing:.14em}
.row{height:22px;border-bottom:1px solid #333}
</style></head><body>
<div class="top">CLOUD_SENTINEL/2.0 <span>FRAME 000000</span><span>POLL 14:32:07Z</span></div>
<div class="field"></div>
<div class="banner">ALL SYSTEMS OPERATIONAL · 0 INCIDENTS · 0 EVENTS</div>
<div class="cols"><div class="c">AWS<b>0000</b></div><div class="c">GCP<b>0000</b></div><div class="c">AZURE<b>0000</b></div></div>
<div class="lists"><div class="l"><h4>LIVE_INCIDENTS [0]</h4><div class="row"></div><div class="row"></div><div class="row"></div></div>
<div class="l"><h4>SECURITY_EVENTS [0]</h4><div class="row"></div><div class="row"></div><div class="row"></div></div></div>
</body></html>
